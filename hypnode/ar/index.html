<!DOCTYPE html>
<html lang="en">

<head>
	<title>Hypnode · Escanea tu sueño</title>
	<meta charset="utf-8">
	<meta name="generator" content="Three.js Editor">
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
	<meta name="theme-color" content="#101114">
	<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
	<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="css/hypnode-start.css">
	<link rel="stylesheet" href="css/app.css">

	<script type="importmap">
	{
		"imports": {
			"three": "./js/three.compat.js",
			"three/addons/": "./js/addons/",
			"mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
		}
	}
	</script>

	<script type="module">
		import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/loaders/GLTFLoader.js';
		window.ThreeGLTFLoader = GLTFLoader;
	</script>
</head>

<body ontouchstart="">

	<div id="ar-container"></div>

	<div id="overlay">
		<svg width="0" height="0" style="position:absolute" aria-hidden="true">
			<symbol id="logo-nodo" viewBox="0 0 64 64">
				<polygon points="32,5 59,25 49,57 15,57 5,25" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round" />
				<g fill="currentColor"><circle cx="32" cy="5" r="3.6" /><circle cx="59" cy="25" r="3.6" /><circle cx="49" cy="57" r="3.6" /><circle cx="15" cy="57" r="3.6" /><circle cx="5" cy="25" r="3.6" /></g>
			</symbol>
		</svg>
		<div class="red"></div>
		<div class="inner">
			<svg class="logo"><use href="#logo-nodo" /></svg>
			<div class="estado"><i></i><span>AR · TARJETA HYPNODE</span></div>
			<h1>Escanea<br><em>tu sueño</em></h1>
			<p>Apunta la cámara a la tarjeta Hypnode. El dispositivo aparecerá frente a ti y podrás explorar su luz, su sonido y su forma.</p>
			<ul class="modos">
				<li><b>LUZ</b></li><li><b>SONIDO</b></li><li><b>FORMA</b></li>
			</ul>
			<button id="start-button"><span class="ring"></span><svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3" /><circle cx="12" cy="12" r="3" /></svg><span id="start-label">Iniciar escaneo</span></button>
			<div id="progress-container">
				<div id="progress-bar-track">
					<div id="progress-bar-fill"></div>
				</div>
				<div id="progress-label">Cargando... 0%</div>
			</div>
			<p class="nota">Necesitamos tu cámara trasera. Nada se graba ni se envía.</p>
			<a class="volver" href="../" data-sfx="atras">← Volver al inicio</a>
		</div>
	</div>

	<script type="module">

		import * as THREE from './js/three.module.js';
		import { APP } from './js/app.js';
		import { MindARController } from './js/mindar/mindar_controller.js';
		import { playSfx } from './js/hypnode-sfx.js';

		window.THREE = THREE; // Used by APP Scripts.

				const overlay = document.getElementById('overlay');
		const startButton = document.getElementById('start-button');
		const arContainer = document.getElementById('ar-container');
		const progressContainer = document.getElementById('progress-container');
		const progressFill = document.getElementById('progress-bar-fill');
		const progressLabel = document.getElementById('progress-label');

		const debugMode = new URLSearchParams(location.search).get('debug') === '1';

		let player = null;
		let mindarController = null;
		let loaded = false;
		let loadPromise = null;

		function setProgress(percent, text) {
			progressFill.style.width = `${percent}%`;
			progressLabel.textContent = `${text} ${percent}%`;
		}

		async function loadEverything() {

			if (loadPromise) return loadPromise;

			loadPromise = (async () => {

				setProgress(0, 'Cargando escena...');

				// Descarga app.json con progreso real (0% - 25%)
				const text = await new Promise((resolve, reject) => {
					const loader = new THREE.FileLoader();
					loader.load(
						'app.json',
						(t) => resolve(t),
						(e) => {
							if (e.lengthComputable) {
								const p = Math.round((e.loaded / e.total) * 25);
								setProgress(p, 'Cargando escena...');
							}
						},
						(err) => reject(new Error(err.statusText || 'No se pudo descargar el json'))
					);
				});

				player = new APP.Player({ alpha: true });
				await player.load(JSON.parse(text));
				player.setSize(window.innerWidth, window.innerHeight);
				player.play();
				setProgress(55, 'Escena lista...');

				document.body.appendChild(player.dom);

				window.addEventListener('resize', function () {
					player.setSize(window.innerWidth, window.innerHeight);
				});

				window.player = player;

				setProgress(85, 'Preparando AR...');

				await new Promise((resolve) => setTimeout(resolve, 10));

				setProgress(100, 'Listo');
				loaded = true;

				console.log(window.player);

			})().catch((e) => {
				loaded = false;
				loadPromise = null; // permite reintentar al pulsar el botón
				throw e;
			});

			return loadPromise;
		}

		// Al darle al botón start se inicia la cámara (requiere gesto del usuario).
		startButton.addEventListener('click', async () => {

			playSfx('inicio');
			try { navigator.vibrate && navigator.vibrate(25); } catch (e) {}
			startButton.classList.add('busy');

			progressContainer.style.display = 'flex';

			try {
				await loadEverything();
				if (!loaded) return;

				setProgress(90, 'Iniciando cámara...');

				// La cámara se inicia aquí, dentro del gesto del usuario.
				mindarController = new MindARController(arContainer, player, debugMode);
				window.mindarController = mindarController;

				await mindarController.start();

				// El player sigue funcionando (scripts/audio) pero su canvas ya no se usa.
				if (player?.dom) player.dom.style.display = 'none';

				overlay.classList.add('hidden');
				setTimeout(() => overlay.remove(), 400);
			} catch (e) {
				console.error('Error durante la carga:', e);
				document.getElementById('start-label').textContent = 'Reintentar';
				startButton.classList.remove('busy');
				setProgress(0, 'Error al iniciar');
			}
		});

		document.querySelectorAll('[data-sfx]').forEach((a) => a.addEventListener('pointerdown', () => playSfx(a.dataset.sfx)));

		// Todo se carga automáticamente al abrir la página.
		loadEverything().catch((e) => {
			console.error('Error durante la carga automática:', e.message);
			progressContainer.style.display = 'flex';
			setProgress(0, 'Error al cargar');
			document.getElementById('start-label').textContent = 'Reintentar';
				startButton.classList.remove('busy');
		});

	</script>
	<script type="module" src="js/hypnode-ui.js"></script>
</body>

</html>
